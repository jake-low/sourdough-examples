<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Americanish</title>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@6/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6/dist/maplibre-gl.mjs";
      import { renderIcons } from "./icons.js";

      const map = new maplibregl.Map({
        container: "map",
        style: await fetch("../dist/americanish.json").then((r) => r.json()),
        hash: true,
      });
      map.addControl(new maplibregl.NavigationControl());

      renderIcons(map);
    </script>
  </body>
</html>
